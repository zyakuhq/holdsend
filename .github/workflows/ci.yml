name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run size

  postgres:
    name: Real Postgres races
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: holdsend-ci
          POSTGRES_DB: holdsend
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Races between real connections
        env:
          HOLDSEND_PG_URL: postgres://postgres:holdsend-ci@localhost:5432/holdsend
        run: |
          npx vitest run packages/server/test/real-postgres.test.ts --reporter=default --reporter=json --outputFile=pg-results.json
          # Fail if the tests were skipped (for example a missing database URL), and leave a visible count.
          node -e 'const r=require("./pg-results.json"); console.log(`::notice title=Real Postgres::${r.numPassedTests} passed, ${r.numPendingTests} skipped`); if (r.numPassedTests < 2 || r.numPendingTests > 0) process.exit(1)'

  example:
    name: Example in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium for Playwright
        working-directory: examples/notes
        run: npx playwright install --with-deps chromium
      - name: Offline, lost-answer and two-tab tests
        run: npm run e2e

  privacy:
    name: Secret and PII scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
          ./gitleaks version
      - name: Secret scan (full history, redacted output)
        run: ./gitleaks git --redact --no-banner --exit-code 1 .
      - name: PII scan
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}
        run: node scripts/pii-scan.mjs
      - name: No company email addresses in commit metadata
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # No commit may carry a company address as author or committer: the
          # pull request's commits, or on main the whole history. The
          # addresses are not printed: logs are public.
          if [ -n "$BASE" ]; then RANGE="$BASE..$HEAD"; else RANGE="HEAD"; fi
          if git log --format='%ae%n%ce' "$RANGE" | grep -qi '@zyaku\.com$'; then
            echo "A commit uses a company email address. Use a GitHub noreply address."
            exit 1
          fi
          echo "commit emails ok"
