name: Release

# Publishes the four @holdsend packages to npm when a version tag (v0.1.0,
# ...) is pushed. The tag must match every package's version. Each package
# is published with provenance, so anyone can check it was built here.
#
# Run it by hand with "dry run" to see exactly what would be published.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be published"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check

      - name: Tag matches the package versions
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./packages/core/package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version."
            exit 1
          fi

      - name: Publish (core first, then the packages that depend on it)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          flags="--access public --provenance"
          if [ "$DRY_RUN" = "true" ]; then flags="$flags --dry-run"; fi
          for pkg in core server web react-native; do
            npm publish --workspace "packages/$pkg" $flags
          done

      - name: GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for what is in this release." --verify-tag
